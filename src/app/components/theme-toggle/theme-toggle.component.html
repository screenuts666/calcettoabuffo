<ion-button
  (click)="openThemeMenu()"
  class="theme-toggle-btn"
  [title]="'Versione v' + appUpdate.version + (isDevEnvironment ? ' [DEV MODE]' : '') + ' (' + appUpdate.buildDate + ') · Tocca per Tema o Pulizia Cache'"
  aria-label="Cambia Tema o Aggiorna App"
>
  @if (isDevEnvironment) {
    <span class="dev-mode-mini-pill">DEV MODE</span>
  }
  <span class="version-mini-pill">v{{ appUpdate.version }}</span>
  <ion-icon [name]="currentIcon"></ion-icon>
</ion-button>
