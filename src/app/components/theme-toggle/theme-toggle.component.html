<div class="header-actions-group">
  @if (authService.isAccountEnabled()) {
    @if (authService.isLoggedIn()) {
      <button
        type="button"
        class="user-header-pill"
        [attr.data-role]="authService.role()"
        (click)="onUserHeaderClick($event)"
        [title]="displayName() + ' • Account & Impostazioni (v' + appUpdate.version + ')'"
        aria-label="Account e Impostazioni"
      >
        <div class="uhp-avatar">
          <app-player-avatar
            [fotoUrl]="userAvatarUrl()"
            [alt]="shortUserName()"
          ></app-player-avatar>
        </div>
        <div class="uhp-info">
          <span class="uhp-name">{{ shortUserName() }}</span>
          <span class="uhp-role-badge" [attr.data-role]="authService.role()">
            {{ authService.roleLabel() }}
          </span>
        </div>
        <ion-icon name="chevron-down-outline" class="uhp-chevron" aria-hidden="true"></ion-icon>
      </button>
    } @else {
      <button
        type="button"
        class="user-login-pill"
        (click)="onUserHeaderClick($event)"
        title="Accedi o Impostazioni"
        aria-label="Accedi o Impostazioni"
      >
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
        <span class="ulp-label">Accedi</span>
      </button>
    }
  }
</div>
