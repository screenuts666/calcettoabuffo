<!-- TELECRONACA IGNORANTE AI (FORMATO PODCAST & ANTEPRIMA COMPATTA) -->
<div class="report-section-card cronaca-section-card">
  <div class="section-card-header">
    <div class="header-left">
      <ion-icon name="mic-outline" class="section-icon mic-icon"></ion-icon>
      <span class="section-title">Telecronaca Ignorante AI</span>
    </div>
    @if (cronacaAi) {
      <div class="header-actions">
        <app-ai-tts-button
          [text]="cronacaAi"
          [id]="'cronaca-' + (matchId || 'temp')"
          label="Ascolta"
          shareTitle="Telecronaca Ignorante Partita"
        ></app-ai-tts-button>
        <button
          type="button"
          class="ai-refresh-btn"
          (click)="generateCronacaClick.emit(true)"
          [disabled]="isGeneratingCronaca"
          title="Rigenera la cronaca con Gemini"
        >
          <ion-icon
            name="refresh-outline"
            [class.spin]="isGeneratingCronaca"
          ></ion-icon>
          <span>{{ isGeneratingCronaca ? "Riscrivo..." : "Rigenera" }}</span>
        </button>
      </div>
    }
  </div>

  @if (cronacaAi) {
    <div class="cronaca-body-wrap" [class.is-collapsed]="!isCronacaExpanded()">
      <div class="cronaca-content-box">
        <div class="cronaca-bubble">
          <div
            class="cronaca-text"
            [innerHTML]="formatAiMarkdown(cronacaAi)"
          ></div>
        </div>
      </div>
      @if (!isCronacaExpanded()) {
        <div class="cronaca-fade-overlay" (click)="toggleCronaca()"></div>
      }
    </div>

    <button
      type="button"
      class="cronaca-expand-btn"
      (click)="toggleCronaca()"
      [attr.aria-expanded]="isCronacaExpanded()"
    >
      <span>{{ isCronacaExpanded() ? "Comprimi telecronaca" : "Leggi tutta la telecronaca" }}</span>
      <ion-icon [name]="isCronacaExpanded() ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
    </button>
  } @else {
    <div class="ai-empty-cronaca-compact">
      <div class="empty-info">
        <span class="empty-icon">📢</span>
        <span class="empty-text">Nessuna telecronaca presente</span>
      </div>
      <button
        type="button"
        class="ai-generate-cronaca-btn"
        (click)="generateCronacaClick.emit(false)"
        [disabled]="isGeneratingCronaca"
      >
        @if (isGeneratingCronaca) {
          <ion-spinner name="crescent"></ion-spinner>
          <span>Generazione in corso...</span>
        } @else {
          <ion-icon name="sparkles"></ion-icon>
          <span>Genera Telecronaca AI</span>
        }
      </button>
    </div>
  }
</div>

<!-- BACHECA TERZO TEMPO & COMMENTI COMMUNITY (IN PRIMO PIANO) -->
@if (matchId) {
  <app-partita-comments [matchId]="matchId" [match]="match"></app-partita-comments>
}
