<!-- TELECRONACA IGNORANTE AI (ACCORDION CHIUSO DI DEFAULT / PULSANTE DI CREAZIONE) -->
@if (cronacaAi) {
  <div class="report-section-card cronaca-section-card" [class.is-expanded]="isCronacaExpanded()">
    <div class="section-card-header clickable-header" (click)="toggleCronaca()">
      <div class="header-left">
        <ion-icon name="sparkles" class="section-icon sparkle-icon"></ion-icon>
        <span class="section-title">✨ Telecronaca AI</span>
      </div>
      <div class="header-actions" (click)="$event.stopPropagation()">
        <app-ai-tts-button
          [text]="cronacaAi"
          [id]="'cronaca-' + (matchId || 'temp')"
          [compact]="true"
          [showWhatsAppShare]="false"
        ></app-ai-tts-button>
        @if (isAdmin) {
          <button
            type="button"
            class="ai-icon-btn refresh-btn"
            (click)="generateCronacaClick.emit(true)"
            [disabled]="isGeneratingCronaca"
            title="Rigenera la telecronaca con Gemini"
          >
            <ion-icon
              name="refresh-outline"
              [class.spin]="isGeneratingCronaca"
            ></ion-icon>
          </button>
        }
        <button
          type="button"
          class="ai-icon-btn chevron-btn"
          (click)="toggleCronaca()"
          [title]="isCronacaExpanded() ? 'Comprimi telecronaca' : 'Leggi telecronaca'"
        >
          <ion-icon
            [name]="isCronacaExpanded() ? 'chevron-up-outline' : 'chevron-down-outline'"
          ></ion-icon>
        </button>
      </div>
    </div>

    @if (isCronacaExpanded()) {
      <div class="cronaca-body-wrap">
        <div class="cronaca-content-box">
          <div class="cronaca-bubble">
            <div
              class="cronaca-text"
              [innerHTML]="formatAiMarkdown(cronacaAi)"
            ></div>
          </div>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="report-section-card cronaca-empty-card">
    <div class="empty-header-row">
      <div class="empty-left">
        <ion-icon name="sparkles" class="section-icon sparkle-icon"></ion-icon>
        <span class="section-title">✨ Telecronaca AI</span>
      </div>
      <button
        type="button"
        class="ai-create-action-btn"
        (click)="generateCronacaClick.emit(false)"
        [disabled]="isGeneratingCronaca"
      >
        @if (isGeneratingCronaca) {
          <ion-spinner name="crescent"></ion-spinner>
          <span>Scrittura in corso...</span>
        } @else {
          <ion-icon name="mic-outline"></ion-icon>
          <span>Crea Telecronaca AI</span>
        }
      </button>
    </div>
  </div>
}

<!-- BACHECA TERZO TEMPO & COMMENTI COMMUNITY (IN PRIMO PIANO) -->
@if (matchId) {
  <app-partita-comments [matchId]="matchId" [match]="match"></app-partita-comments>
}
