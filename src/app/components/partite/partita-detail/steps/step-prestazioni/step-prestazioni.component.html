<div class="prestazioni-container">

  <!-- 1. HERO COMPONENT (TOP BAR, SCOREBOARD, MARCATORI, UPSET) -->
  <app-prestazioni-hero
    [dataPartita]="state.dataPartita()"
    [luogo]="state.luogo()"
    [timerFormatted]="state.formatTimer()"
    [orarioInizio]="orarioInizio()"
    [orarioFine]="orarioFine()"
    [scoreA]="state.scoreA()"
    [scoreB]="state.scoreB()"
    [pagelleInserite]="state.pagelleInserite()"
    [isAdmin]="isAdmin"
    [scorersA]="scorersA()"
    [scorersB]="scorersB()"
    [isUpset]="report().isUpset"
    [upsetDescription]="report().upsetDescription"
    [meteo]="meteoInfo()"
    (shareClick)="apriCondivisione()"
    (editScoreClick)="apriModificaRisultato()"
  ></app-prestazioni-hero>

  <!-- 2. STICKY NAV BAR -->
  <div class="report-nav-bar-wrapper">
    <div class="report-segments-bar">
      <button
        type="button"
        class="segment-tab-btn"
        [class.active]="activeTab() === 'sintesi'"
        (click)="activeTab.set('sintesi')"
      >
        <ion-icon name="flash"></ion-icon>
        <span class="tab-label-text">Resoconto</span>
      </button>

      <button
        type="button"
        class="segment-tab-btn"
        [class.active]="activeTab() === 'pagelle'"
        (click)="activeTab.set('pagelle')"
      >
        <ion-icon name="clipboard-outline"></ion-icon>
        <span class="tab-label-text">Pagelle</span>
        @if (!state.pagelleInserite()) {
          <span class="tab-badge-dot" title="Da Votare"></span>
        }
      </button>

      <button
        type="button"
        class="segment-tab-btn"
        [class.active]="activeTab() === 'portieri'"
        (click)="activeTab.set('portieri')"
      >
        <ion-icon name="shield-outline"></ion-icon>
        <span class="tab-label-text">Portieri</span>
      </button>

      <button
        type="button"
        class="segment-tab-btn"
        [class.active]="activeTab() === 'spogliatoio'"
        (click)="activeTab.set('spogliatoio')"
      >
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <span class="tab-label-text">Terzo Tempo</span>
      </button>

      <button
        type="button"
        class="segment-tab-btn"
        [class.active]="activeTab() === 'statistiche'"
        (click)="activeTab.set('statistiche')"
      >
        <ion-icon name="trending-up-outline"></ion-icon>
        <span class="tab-label-text">Stats & MMR</span>
      </button>
    </div>
  </div>

  <!-- 3. TAB VIEWS (DELEGATED TO ATOMIC COMPONENTS) -->
  <div class="tab-content-area animate-fade-in">
    @if (activeTab() === 'sintesi') {
      <app-prestazioni-tab-sintesi
        [match]="match()"
        [mvp]="report().mvp"
        [worst]="report().worst"
        [eventiGol]="state.eventiGol()"
        [isAdmin]="isAdmin"
        [gkSummary]="gkSummary()"
        (shareClick)="apriCondivisione()"
        (editAssistClick)="modificaAssistEvento($event)"
      ></app-prestazioni-tab-sintesi>
    }

    @if (activeTab() === 'pagelle') {
      <app-prestazioni-tab-pagelle
        [playersA]="report().playersA"
        [playersB]="report().playersB"
        [scoreA]="state.scoreA()"
        [scoreB]="state.scoreB()"
        [votoMedioA]="report().votoMedioA"
        [votoMedioB]="report().votoMedioB"
        [teamAvgMmrDeltaA]="report().teamAvgMmrDeltaA"
        [teamAvgMmrDeltaB]="report().teamAvgMmrDeltaB"
        [pagelleInserite]="state.pagelleInserite()"
        [isAdmin]="isAdmin"
        [mvpId]="report().mvp?.id"
        [commentoPartita]="state.commentoPartita()"
        [isSavingCommento]="isSavingCommento()"
        (commentoChange)="onCommentoPartitaChange($event)"
        (saveCommentoClick)="salvaCommentoPartita($event)"
        (voteChange)="aggiornaVoto($event.player, $event.event)"
        (noteChange)="aggiornaNote($event.player, $event.note)"
        (editAssist)="modificaAssist($event)"
      ></app-prestazioni-tab-pagelle>
    }

    @if (activeTab() === 'portieri') {
      <app-prestazioni-tab-portieri
        [match]="match()"
        [isAdmin]="isAdmin"
        [gkSummary]="gkSummary()"
        [parateIncredibili]="state.parateIncredibili()"
        [notePortieri]="state.notePortieri()"
        [bonusParataMmr]="bonusParataMmr()"
        (parataChange)="onParataChange($event)"
        (salvaNote)="onSalvaNotePortieri($event)"
      ></app-prestazioni-tab-portieri>
    }

    @if (activeTab() === 'spogliatoio') {
      <app-prestazioni-tab-spogliatoio
        [matchId]="state.matchId()"
        [match]="match()"
        [cronacaAi]="state.cronacaAi()"
        [isAdmin]="isAdmin"
        [isGeneratingCronaca]="isGeneratingCronaca()"
        (generateCronacaClick)="generaCronaca($event)"
      ></app-prestazioni-tab-spogliatoio>
    }

    @if (activeTab() === 'statistiche') {
      <app-prestazioni-tab-statistiche
        [matchId]="state.matchId()"
        [report]="report()"
        [isAdmin]="isAdmin"
      ></app-prestazioni-tab-statistiche>
    }
  </div>

  <!-- 4. PULSANTE FLOTTANTE ADMIN PER SALVATAGGIO -->
  @if (isAdmin) {
    <div class="fab-fixed-container">
      <button
        class="fab-round"
        [class.is-archived]="state.pagelleInserite()"
        (click)="salvaModifiche()"
        [title]="state.pagelleInserite() ? 'Salva Modifiche' : 'Concludi e Archivia'"
      >
        <ion-icon [name]="state.pagelleInserite() ? 'save-outline' : 'checkmark-done'"></ion-icon>
      </button>
    </div>
  }

</div>
