<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>Calcetto abbuffo</title>

  <base href="/"/>

  <!-- Prevenzione aggressiva caching HTML browser / WebView / PWA -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg"/>
  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192x192.png"/>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Guardia Pre-Bootstrap: controlla /version.json prima ancora dell'avvio di Angular -->
  <script>
    (function () {
      try {
        var host = window.location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') return;

        fetch('/version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          }
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (remote) {
            if (!remote || !remote.buildId) return;
            var storedBuild = localStorage.getItem('calcetto_app_build_id');
            var prevVersion = localStorage.getItem('calcetto_app_version');
            if (!storedBuild) return; // Primo avvio: lo salverà AppUpdateService

            if (storedBuild !== remote.buildId) {
              var guardRaw = localStorage.getItem('calcetto_reloaded_for_build') || '';
              var parts = guardRaw.split('|');
              var guardId = parts[0];
              var guardTs = parseInt(parts[1] || '0', 10);
              if (guardId === remote.buildId && (Date.now() - guardTs) < 60000) {
                return;
              }

              console.log('[PreBootstrap] Nuova versione rilevata (' + remote.version + '), pulizia cache e cookie in corso...');

              // 1. Pulizia Cookie
              if (document.cookie) {
                document.cookie.split(';').forEach(function (c) {
                  var name = c.split('=')[0].trim();
                  if (name) {
                    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                  }
                });
              }

              // 2. Aggiorna guardie localStorage preservando la versione precedente per le Release Notes
              if (prevVersion && prevVersion !== remote.version) {
                localStorage.setItem('calcetto_update_from_version', prevVersion);
              }
              localStorage.setItem('calcetto_app_build_id', remote.buildId);
              localStorage.setItem('calcetto_app_version', remote.version || '');
              localStorage.setItem('calcetto_reloaded_for_build', remote.buildId + '|' + Date.now());
              localStorage.setItem('calcetto_just_updated_to', remote.version || '');
              try { sessionStorage.clear(); } catch (e) {}

              // 3. Deregistra Service Worker & svuota CacheStorage, poi ricarica con cache-buster
              var p1 = ('serviceWorker' in navigator)
                ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                  }).catch(function () {})
                : Promise.resolve();

              var p2 = ('caches' in window)
                ? window.caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                  }).catch(function () {})
                : Promise.resolve();

              Promise.all([p1, p2]).finally(function () {
                var url = new URL(window.location.href);
                url.searchParams.set('_v', remote.buildId + '_' + Date.now());
                window.location.replace(url.toString());
              });
            }
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <app-root>
    <style>
      body {
        margin: 0;
        background-color: #121212;
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        background-color: #121212;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #2dd36f;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      .loading-text {
        font-size: 1.1em;
        font-weight: 600;
        letter-spacing: 0.5px;
        opacity: 0.8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div class="loading-container">
      <div class="spinner"></div>
      <div class="loading-text">Caricamento Calcetto Abbuffo...</div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
