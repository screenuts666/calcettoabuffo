name: Remote Hotfix Agent

on:
  repository_dispatch:
    types: [remote_hotfix]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Descrizione del bug o hotfix da applicare'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID (opzionale per notifica)'
        required: false
        type: string
      task_id:
        description: 'Task ID univoco'
        required: false
        type: string

jobs:
  run-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Remote Hotfix Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload || inputs) }}
        run: node scripts/remote-hotfix-runner.mjs

