name: Remote Hotfix Agent (Google Gemini CLI)

on:
  repository_dispatch:
    types: [remote_hotfix]
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Descrizione del bug o hotfix da applicare'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID (opzionale)'
        required: false
        type: string

jobs:
  gemini-coding-agent:
    # Esegui se è dispatch da Telegram, dispatch manuale, o issue con label 'hotfix'
    if: |
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'hotfix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Parse Trigger Inputs
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "prompt=${{ github.event.client_payload.prompt }}" >> $GITHUB_OUTPUT
            echo "task_id=${{ github.event.client_payload.task_id }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "prompt=${{ github.event.issue.title }}. ${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
            echo "task_id=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
          else
            echo "prompt=${{ inputs.prompt }}" >> $GITHUB_OUTPUT
            echo "task_id=manual-$(date +%s)" >> $GITHUB_OUTPUT
            echo "chat_id=${{ inputs.chat_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Isolated Branch
        run: |
          TASK_ID="${{ steps.meta.outputs.task_id }}"
          BRANCH_NAME="hotfix/${TASK_ID}"
          git config user.name "Gemini Cloud Agent"
          git config user.email "gemini-agent@google.com"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Install Google Gemini CLI Action
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "latest"
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"

      - name: Execute Autonomous Agent
        run: |
          PROMPT_TEXT="${{ steps.meta.outputs.prompt }}"
          echo "Executing Gemini CLI with prompt: $PROMPT_TEXT"
          gemini -p "$PROMPT_TEXT. Read and follow all instructions in GEMINI.md."

      - name: Verify Angular Build
        run: |
          echo "Verifica di compilazione Angular post-agent..."
          npm run build

      - name: Commit and Push Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "hotfix: ${{ steps.meta.outputs.prompt }}"
            git push origin "$BRANCH_NAME" --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Nessuna modifica rilevata."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request on GitHub
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Hotfix: ${{ steps.meta.outputs.prompt }}" \
            --body "Autonomous hotfix generated by Google Gemini CLI in GitHub Actions cloud runner.%0A%0ACloses ${{ steps.meta.outputs.task_id }}." \
            --base main \
            --head "$BRANCH_NAME")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "Pull Request creata: $PR_URL"

      - name: Notify Telegram (Success)
        if: steps.meta.outputs.chat_id != '' && success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.meta.outputs.chat_id }}
          PR_URL: ${{ env.PR_URL }}
        run: |
          MSG="🎉 <b>Hotfix Completato da Gemini CLI!</b>%0A%0A📌 <i>${{ steps.meta.outputs.prompt }}</i>%0A%0A🔗 <a href='${PR_URL}'><b>Visualizza la Pull Request su GitHub</b></a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML"

      - name: Notify Telegram (Failure)
        if: steps.meta.outputs.chat_id != '' && failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.meta.outputs.chat_id }}
        run: |
          MSG="❌ <b>Hotfix Fallito:</b> Si è verificato un errore durante l'esecuzione del task su GitHub Actions.%0AControlla i log su GitHub Actions per maggiori dettagli."
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML"
